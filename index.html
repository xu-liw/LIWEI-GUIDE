    <style>
      :root {
        /* English uses Playfair, Chinese falls back to Noto Serif TC */
        --font-title: 'Playfair Display', 'Noto Serif TC', serif;
        /* English uses Lato, Chinese falls back to Noto Serif TC (User requested Chinese to be serif) */
        --font-body: 'Lato', 'Noto Serif TC', sans-serif;
        --color-navy: #000053;
        --color-gold: #C5A059;
      }

      /* Global Font Settings */
      body {
        font-family: var(--font-body) !important;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      
      h1, h2, h3, h4, h5, h6, .font-serif {
        font-family: var(--font-title) !important;
      }
      
      /* Hide scrollbar for clean horizontal scrolling */
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }

      /* Global Noise Texture Overlay */
      .bg-noise {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        pointer-events: none;
        z-index: 50;
        opacity: 0.04;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
      }

      /* Cinematic Ken Burns Effect */
      @keyframes kenBurns {
        0% { transform: scale(1); }
        100% { transform: scale(1.1); }
      }
      .animate-ken-burns {
        animation: kenBurns 20s ease-out infinite alternate;
      }

      /* Animations */
      @keyframes titleReveal {
        0% {
          opacity: 0;
          transform: translateY(20px) scale(0.98);
          filter: blur(8px);
        }
        100% {
          opacity: 1;
          transform: translateY(0) scale(1);
          filter: blur(0);
        }
      }

      @keyframes subtitleReveal {
        0% {
          opacity: 0;
          letter-spacing: 0.1em;
          transform: translateY(10px);
        }
        100% {
          opacity: 0.8;
          letter-spacing: 0.25em;
          transform: translateY(0);
        }
      }

      @keyframes fadeInUp {
        0% {
          opacity: 0;
          transform: translateY(15px);
        }
        100% {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes modalSlideUp {
        0% {
          opacity: 0;
          transform: translateY(30px) scale(0.98);
        }
        100% {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }

      .animate-title-reveal {
        animation: titleReveal 1.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }

      .animate-subtitle-reveal {
        opacity: 0;
        animation: subtitleReveal 2s cubic-bezier(0.16, 1, 0.3, 1) 0.6s forwards;
      }

      .animate-fade-in-up {
        animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }

      .animate-modal-enter {
        animation: modalSlideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
      
      /* Text Shadow for better contrast on images */
      .text-shadow {
        text-shadow: 0 2px 4px rgba(0,0,0,0.5);
      }
      
      .text-shadow-lg {
        text-shadow: 0 4px 12px rgba(0,0,0,0.6);
      }

      @keyframes lightboxFadeIn {
        0% { opacity: 0; }
        100% { opacity: 1; }
      }
      @keyframes lightboxZoomIn {
        0% { opacity: 0; transform: scale(0.95); }
        100% { opacity: 1; transform: scale(1); }
      }
      .animate-lightbox-fade {
        animation: lightboxFadeIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
      .animate-lightbox-zoom {
        animation: lightboxZoomIn 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
